org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

mod_id=arcadia_ctp
mod_name=Arcadia CTP
mod_version=0.1.0
mod_group=fr.arcadia.ctp
mod_license=LGPL-3.0-only
mod_authors=curveo
mod_description=Claim & Team Protection - makes other mods respect FTB Teams and FTB Chunks. Covers Create (configuration packets, contraptions) and Waystones (team visibility, registering waystones inside claims), each under a policy set from an in-game admin panel.
mod_repo_url=https://github.com/Blushister/CTP
mod_issue_tracker_url=https://github.com/Blushister/CTP/issues

minecraft_version=1.21.1
neo_version=21.1.221
create_version=6.0.10

# Waystones is published to a reachable Maven, unlike FTB, so it needs no local jar.
# Compiled against the version the Arcadia pack runs. TEAM visibility exists in 21.1.36
# and later but not in 21.1.15; the Maven has no build in between to narrow it further.
waystones_version=21.1.37+1.21.1

# FTB Chunks/Teams/Library are not published to any reachable Maven repository, so
# they are resolved as local files. Drop the three jars in libs/ (ignored by git: they
# are All Rights Reserved and must not be redistributed), or point this elsewhere with
# -Pftb_jar_dir=... or in ~/.gradle/gradle.properties. See README.md.
ftb_jar_dir=libs
ftb_chunks_jar=ftb-chunks-neoforge-2101.1.14.jar
ftb_teams_jar=ftb-teams-neoforge-2101.1.10.jar
ftb_library_jar=ftb-library-neoforge-2101.1.31.jar
